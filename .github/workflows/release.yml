name: Release

# 推送 v* 格式的 tag 时触发自动打包并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  # 支持手动触发（用于测试打包流程，不发布 Release）
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14       # Apple Silicon (arm64) 原生构建
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: macos-14       # Intel (x86_64) 在 ARM 上交叉编译，避免 Intel runner 排队
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04   # Linux x86_64 (仅 deb)
            args: '--bundles deb'
            target: 'x86_64-unknown-linux-gnu'
          - platform: ubuntu-24.04-arm # Linux ARM64 (仅 deb)
            args: '--bundles deb'
            target: 'aarch64-unknown-linux-gnu'
          - platform: windows-latest # Windows
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'iroh-transfer ${{ github.ref_name }}'
          releaseBody: 'P2P 文件传输桌面应用。下方为对应平台的安装包，下载后双击安装即可。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          retryAttempts: 3